name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Sync dependencies
        run: uv sync --frozen
      - name: Compile source
        run: uv run python -m compileall -q config.py diagnostics.py graph.py history.py main.py perception.py safety.py settings.py tools.py maintenance
      - name: Run repository maintenance audits
        run: |
          uv run python maintenance/ci_contract_audit.py
          uv run python maintenance/env_example_audit.py
          uv run python maintenance/python_version_audit.py
          uv run python maintenance/model_asset_audit.py
      - name: Run tests
        run: uv run --with pytest pytest -q
